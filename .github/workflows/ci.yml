name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + typecheck + lint + test
    runs-on: ubuntu-latest

    # The Postgres suites are gated on LOOM_TEST_POSTGRES_URL and skip cleanly
    # without it — which meant they had never run in CI, and a skipped suite reads
    # exactly like a passing one. A service container is a throwaway database for
    # the life of the job; it needs a Linux runner, which this already is.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loomtest
        ports:
          - 5432:5432
        # `options` are docker-create flags, not server flags — a service container
        # takes no command, so `-c max_connections=…` cannot go here (it makes
        # `docker create` exit 125). It is not needed: the conformance suite opens
        # 32 pools for schema isolation but fills them lazily, and a measured run
        # peaks at 51 backends against the image's default ceiling of 100.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
        env:
          # Declared in turbo.json's `test` task, so it is part of the cache key —
          # otherwise a cached result from a database-less run is replayed here.
          LOOM_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/loomtest
